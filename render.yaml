# Render Blueprint for automatic zero-configuration deployment (MongoDB Edition)
services:
  - type: web
    name: algovisual-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
